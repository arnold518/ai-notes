site_name: Computer Science Notes

site_url: https://arnold518.github.io/cs-notes/

repo_name: arnold518/cs-notes

repo_url: https://github.com/arnold518/cs-notes

theme:
  name: material
  features:
    - content.code.copy
    - header.autohide
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - navigation.indexes
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: material/lightbulb-on
      tip: fontawesome/solid/clock
  language: ko  
  font:
    text: Noto Sans
    code: Ubuntu Mono
  palette: 
      # Palette toggle for light mode
      - media: "(prefers-color-scheme: light)"
        scheme: default
        primary: deep orange
        accent: deep orange
        toggle:
          icon: material/weather-sunny
          name: Switch to dark mode
      # Palette toggle for dark mode
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: deep orange
        accent: deep orange
        toggle:
          icon: material/weather-night
          name: Switch to light mode
    
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags:
      tags_file: tags.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arnold518
  generator: false

nav:
  - Home: index.md
  - AI Paper Review:
      - paper-review/index.md
      - 1. RNN: paper-review/1.md
      - 2. LSTM: paper-review/2.md
      - 3. Sequence-to-Sequence: paper-review/3.md
      - 4. Attention: paper-review/4.md
      - 5. Transformer: paper-review/5.md
  - Mathematical Foundations of Deep Neural Networks:
      - mfdnn/format/index.md
      - Ch 1. Optimization and Stochastic Gradient Descent:
          - 1. Optimization Problem : mfdnn/format/1.md
          - 2. Gradient Descent: mfdnn/format/2.md
          - Chapter 1 Code: https://drive.google.com/file/d/1PSpoeseUPIptYQOPuQpxNawxtZbVR_K6/view?usp=sharing
      - Ch 2. Shallow Neural Networks to Multilayer Perceptrons:
          - 3. Shallow Neural Networks : mfdnn/format/3.md
          - 4. Deep Neural Networks : mfdnn/format/4.md
          - Chapter 2 Code: https://drive.google.com/file/d/15kXC3cJUV63gZNfXK6JdPPuSrwQZBzI8/view?usp=sharing
      - Ch 3. Convolutional Neural Networks:
          - 5. Convolutional Neural Networks : mfdnn/format/5.md
          - 6. Foundations of Design and Training of Deep Neural Networks : mfdnn/format/6.md
          - 7. ImageNet Challenge : mfdnn/format/7.md
          - Chapter 3 Code: https://drive.google.com/file/d/12O9fLasWDA-kOKBD-lE-1UhCl-PoDf0z/view?usp=sharing
      - Ch 4. CNNs for Other Supervised Learning Tasks:
          - 8. CNNs for Other Supervised Learning Tasks : mfdnn/format/8.md
          - Chapter 4 Code: https://drive.google.com/file/d/16IOKVF6IiDMyUvL73pGKBaEMKyXvezLB/view?usp=sharing
      - Ch 5. Unsupervised Learning:
          - 9. Autoencoder : mfdnn/format/9.md
          - 10. Flow Models : mfdnn/format/10.md
          - 11. Variational Autoencoders : mfdnn/format/11.md
          - 12. Generative Adversarial Networks : mfdnn/format/12.md
          - Chapter 5 Code: https://drive.google.com/file/d/1JM5k-e6LkhZ0vXRlfROWpiuw4YC85Jv1/view?usp=sharing
      - Ch A. Appendix - Basics of Monte Carlo:
          - 13. Basics of Monte Carlo : mfdnn/format/13.md
          - Chapter A Code: https://drive.google.com/file/d/18b01xoORd0LFQmpfc_4ou5Rv44MY1neg/view?usp=sharing
      - Python Basics:
          - Python Lecture 1: https://drive.google.com/file/d/1-iY9XfDhWNRDq3z_wVVvOzU04aRQWAfW/view?usp=drive_link
          - Python Lecture 2: https://drive.google.com/file/d/1BANbCC6jBjPEUFSRJMFkcLbc4oVmoQHm/view?usp=sharing
          - Python Lecture 3: https://drive.google.com/file/d/1-Bc11RZmno6yx37kfVLjsyY-XKpLK5Je/view?usp=drive_link
  - Reinforcement Learning:
      - rl/index.md
      - Ch 1. Tabular Solution Methods:
          - 2. Multi-armed Bandits : rl/2.md
          - 3. Finite Markov Decision Processes : rl/3.md
          - 4. Dynamic Programming : rl/4.md
          - 5. Monte Carlo Methods : rl/5.md
          - 6. Temporal-Difference Learning : rl/6.md
          - 7. n-step Bootstrapping : rl/7.md
          - 8. Planning and Learning with Tabular Methods : rl/8.md
      - Ch 2. Approximate Solution Methods:
          - 9. On-policy Prediction with Approximation : rl/9.md
          - 10. On-policy Control with Approximation : rl/10.md
          - 11. Off-policy Methods with Approximation : rl/11.md
          - 12. Eligibility Traces : rl/12.md
          - 13. Policy Gradient Methods : rl/13.md
      - Ch 3. Looking Deeper:
          - 14. Psychology : rl/14.md
          - 15. NeuroScience : rl/15.md
          - 16. Applications and Case Studies : rl/16.md
          - 17. Frontiers : rl/17.md